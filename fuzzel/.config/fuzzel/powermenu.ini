# Fuzzel powermenu config
# Adapted from main fuzzel.ini with similar styling

[main]
font=Geist:weight=150:size=14
placeholder=Power
prompt=""
layer=overlay
namespace=fuzzel
lines=4
width=30
horizontal-pad=32
vertical-pad=20
inner-pad=8
line-height=36

[colors]
background=1e1e20ff
text=f5f5f7f0
match=f5f5f79e
selection=ffffff1f
selection-text=ffffffff
selection-match=f5f5f7f0
border=3d3d3fff

[border]
width=1
radius=6

[dmenu]
mode=text
