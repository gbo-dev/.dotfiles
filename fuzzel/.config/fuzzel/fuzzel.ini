# Fuzzel config (drun app launcher)
# Docs: man fuzzel.ini

[main]
font=Geist:size=16
placeholder=Search
prompt=""
terminal=ghostty
layer=overlay
namespace=fuzzel
lines=10
width=46
horizontal-pad=48
vertical-pad=24
inner-pad=8
line-height=36
image-size-ratio=0.30

[colors]
background=1e1e20ff
text=f5f5f7f0
match=f5f5f79e
selection=ffffff1f
selection-text=ffffffff
selection-match=f5f5f7f0
border=3d3d3fff

[border]
width=1
radius=6

[dmenu]
# Enables `fuzzel -d`
mode=text
