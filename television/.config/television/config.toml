# Only settings that differ from tv's defaults.

[ui]
theme = "dotfiles"

# The input bar ignores border_type here; channels set it in their [ui].
[ui.input_bar]
prompt = ">"

[ui.results_panel]
border_type = "plain"

[ui.preview_panel]
border_type = "plain"

[ui.status_bar]
separator_open = ""
separator_close = ""
