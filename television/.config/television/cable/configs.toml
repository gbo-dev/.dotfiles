# Candidates come from zsh/.config/zsh/pick.zsh, so `c` and this channel
# share one list.
[metadata]
name = "configs"
description = "~/.config directories, most recently picked first"

[source]
command = "zsh -fc 'source \"${ZDOTDIR:-$HOME/.config/zsh}/pick.zsh\"; _pick_list configs'"
display = "{split:/:-1}"
frecency = false

[ui]
input_bar.prompt = "Configs>"
input_bar.border_type = "plain"
preview_panel.hidden = true
